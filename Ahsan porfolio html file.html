<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#060b17;--bg2:#0b1426;--card:rgba(20,34,62,.55);--line:rgba(120,190,255,.18);--tx:#e6eefc;--mut:#9fb0cc;--ac:#2f8cff;--ac2:#22e1ff;--hd:'Sora',system-ui,sans-serif;--bd:'Source Sans 3',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f3f7ff;--bg2:#e4edfb;--card:rgba(255,255,255,.75);--line:rgba(20,70,160,.18);--tx:#0c1a33;--mut:#4a5b78;--ac:#0b62d6;--ac2:#007c98}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){--bg:#f3f7ff}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1.06rem/1.65 var(--bd);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac2);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--hd);line-height:1.15;margin:0}
.wrap{width:min(1100px,92%);margin-inline:auto}
section{padding:96px 0}
section:nth-of-type(even){background:var(--bg2)}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:12px}
.lead{color:var(--mut);max-width:60ch;margin:0 0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 1.2rem var(--hd);text-decoration:none;color:var(--ac2)}
.links{display:flex;gap:6px;align-items:center}
.links a{text-decoration:none;color:var(--mut);padding:8px 12px;border-radius:8px;font-weight:600;font-size:.95rem;transition:.2s}
.links a:hover,.links a.on{color:var(--tx);background:var(--card)}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:1.1rem}
#menu{display:none}
@media(max-width:820px){#menu{display:inline-block}.links{position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);padding:12px 4%;border-bottom:1px solid var(--line);display:none}.links.open{display:flex}}
#hero{min-height:calc(100vh - 64px);display:flex;align-items:center;position:relative;overflow:hidden;padding:60px 0;background:radial-gradient(800px 500px at 80% 10%,rgba(47,140,255,.22),transparent 60%),var(--bg)}
#net{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
#hero .wrap{position:relative;display:grid;grid-template-columns:1.3fr .7fr;gap:40px;align-items:center}
@media(max-width:820px){#hero .wrap{grid-template-columns:1fr}.pic{order:-1;max-width:220px}}
.term{font:600 .9rem ui-monospace,Menlo,monospace;color:var(--ac2);margin-bottom:16px}
.term::after{content:"_";animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800;letter-spacing:-.02em}
.sub{font:600 clamp(1.05rem,2.4vw,1.35rem) var(--hd);color:var(--ac2);margin:16px 0}
.intro{color:var(--mut);max-width:52ch;margin:0 0 30px}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:13px 26px;border-radius:12px;margin:0 10px 10px 0;transition:.25s;border:1px solid var(--ac);cursor:pointer;font-family:var(--bd);font-size:1rem}
.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#021024;border:0;box-shadow:0 0 24px rgba(34,225,255,.35)}
.p:hover{box-shadow:0 0 38px rgba(34,225,255,.65);transform:translateY(-2px)}
.s{color:var(--tx)}.s:hover{background:var(--card);box-shadow:0 0 20px rgba(47,140,255,.35)}
.pic{aspect-ratio:1;border-radius:50%;border:2px solid var(--ac2);box-shadow:0 0 50px rgba(47,140,255,.4);background:var(--card);display:grid;place-items:center;overflow:hidden;width:100%;max-width:320px;justify-self:center}
.pic img{width:100%;height:100%;object-fit:cover}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;backdrop-filter:blur(12px)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:36px}
@media(max-width:820px){.about{grid-template-columns:1fr}}
.about p{margin:0 0 14px;color:var(--mut)}
dl{margin:0}dt{font:700 .95rem var(--hd);color:var(--ac2);margin-top:14px}dd{margin:2px 0 0;color:var(--mut)}
.sk{display:flex;gap:14px;align-items:flex-start}
.ico{font-size:1.6rem;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(47,140,255,.15);flex:none}
.sk h3{font-size:1.05rem}
.bar{height:8px;border-radius:8px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;transition:width 1.2s ease}
.sk small,.meta{color:var(--mut);font-size:.88rem}
.card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.card .im{height:150px;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(135deg,rgba(47,140,255,.35),rgba(34,225,255,.12))}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .b{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card p{margin:0;color:var(--mut);font-size:.98rem}
.tag{display:inline-block;font:600 .78rem ui-monospace,Menlo,monospace;color:var(--ac2);border:1px solid var(--line);padding:2px 9px;border-radius:20px;margin:0 6px 6px 0}
.badge{font-size:.8rem;color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:2px 10px;align-self:flex-start}
.card a.v{margin-top:auto;color:var(--ac2);font-weight:600;text-decoration:none}
.card a.v:hover{text-decoration:underline}
.tl{border-left:2px solid var(--ac);padding-left:24px;max-width:700px}
.ph{border:1px dashed var(--line);border-radius:18px;padding:34px;text-align:center;color:var(--mut)}
form{display:grid;gap:14px}
label{font-weight:600;font-size:.92rem}
input,textarea{width:100%;margin-top:6px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.cl{display:flex;flex-direction:column;gap:12px}
.cl a{text-decoration:none;display:flex;gap:12px;align-items:center}
.cl a:hover span{color:var(--ac2)}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--mut)}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
footer nav{all:unset}footer a{margin-left:16px;text-decoration:none}footer a:hover{color:var(--ac2)}
#msg{color:var(--ac2);min-height:1.4em;margin:0}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:340px;text-align:center}dialog::backdrop{background:rgba(0,0,0,.6)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

 projects:[["📡","Network Discovery Lab","Planned lab to explore how devices find each other on a home network, using safe, owned equipment only.",["Networking","Linux"],"#"],["🧮","C++ Programming Projects","A space for the C++ exercises and small programs I build as I learn.",["C++","DSA"],"#"],["🔐","Cybersecurity Learning Lab","A home lab idea for practicing security fundamentals in an isolated environment.",["Security","Virtual machines"],"#"]],
 edu:[["B.E. Tech in Cyber Security","International Islamic University Islamabad (IIUI), Pakistan","Started Fall 2025 · Currently studying"],["Intermediate (12th), ICS","Arfah Institute of Modern Studies (AIMS), Tattapani, Kashmir","Completed"],["Matric","Boys Higher Secondary School Dhanwan, Kotli, Azad Kashmir","Completed"]],
 certs:[] // e.g. [["Certificate name","Issuer","Year"]]
};
</script>
<script>
const $=s=>document.querySelector(s),E=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S=SITE;
const pic=S.photo?`<img src="${E(S.photo)}" alt="Portrait of ${E(S.name)}">`:`<svg viewBox="0 0 100 100" width="55%" fill="none" stroke="currentColor" stroke-width="3" style="color:var(--ac2)" role="img" aria-label="Profile photo placeholder"><circle cx="50" cy="38" r="16"/><path d="M18 88c4-20 18-28 32-28s28 8 32 28"/></svg>`;
const sec=(id,h,lead,inner)=>`<section id="${id}"><div class="wrap"><h2>${h}</h2>${lead?`<p class="lead">${lead}</p>`:""}${inner}</div></section>`;
document.querySelector("main").innerHTML=`
<section id="home" style="padding:0"><div id="hero"><canvas id="net" aria-hidden="true"></canvas><div class="wrap"><div><div class="term">$ whoami</div><h1>Hi, I'm ${E(S.name)}.</h1><div class="sub">Cyber Security Student | Future Cyber Security Expert</div><p class="intro">Exploring cybersecurity, networking, programming, and the technologies that make the digital world safer.</p><a class="btn p" href="#projects">Explore My Work</a><a class="btn s" href="#contact">Contact Me</a></div><div class="pic">${pic}</div></div></div></section>`+
sec("about","About me","",`<div class="about"><div>${S.about.map(p=>`<p>${E(p)}</p>`).join("")}</div><div class="glass"><dl>${S.highlights.map(h=>`<dt>${E(h[0])}</dt><dd>${E(h[1])}</dd>`).join("")}</dl></div></div>`)+
sec("skills","Skills","Self-assessed levels of where I am today. They'll change as I learn.",`<div class="grid">${S.skills.map(k=>`<div class="glass sk"><div class="ico" aria-hidden="true">${k[0]}</div><div style="flex:1"><h3>${E(k[1])}</h3><div class="bar" role="progressbar" aria-valuenow="${k[2]}" aria-valuemin="0" aria-valuemax="100" aria-label="${E(k[1])} level"><i data-w="${k[2]}"></i></div><small>${E(k[3])} · ${k[2]}%</small></div></div>`).join("")}</div>`)+
sec("projects","Projects","Placeholders for now. These are ideas I'm working toward, not finished work.",`<div class="grid">${S.projects.map(p=>`<article class="glass card"><div class="im" aria-hidden="true">${p[0]}</div><div class="b"><span class="badge">Placeholder: in progress</span><h3>${E(p[1])}</h3><p>${E(p[2])}</p><div>${p[3].map(t=>`<span class="tag">${E(t)}</span>`).join("")}</div><a class="v" href="#projects" data-soon>View Project</a></div></article>`).join("")}</div>`)+
sec("education","Education","",`<div class="tl">${S.edu.map(e=>`<div class="glass" style="margin-bottom:16px"><h3>${E(e[0])}</h3><p style="margin:6px 0;color:var(--ac2);font-weight:600">${E(e[1])}</p><p class="meta">${E(e[2])}</p></div>`).join("")}</div>`+
`<div style="height:56px"></div><h2>Certifications and achievements</h2>`+(S.certs.length?`<div class="grid">${S.certs.map(c=>`<div class="glass"><h3>${E(c[0])}</h3><p class="meta">${E(c[1])} · ${E(c[2])}</p></div>`).join("")}</div>`:`<div class="ph">Nothing here yet. Certifications, courses and competitions will appear as I earn them.</div>`))+
sec("contact","Contact","Questions, internships or collaboration? Send a message.",`<div class="about"><form id="f"><div class="two"><label>Name<input name="n" required autocomplete="name"></label><label>Email<input type="email" name="e" required autocomplete="email"></label></div><label>Subject<input name="s" required></label><label>Message<textarea name="m" rows="5" required></textarea></label><div><button class="btn p" type="submit">Send message</button></div><p id="msg" role="status"></p></form><div class="glass cl"><a href="mailto:${E(S.email)}"><span>✉️</span><span>${E(S.email)}</span></a><a href="https://wa.me/${S.whatsapp}?text=Hi%20Ahsan" target="_blank" rel="noopener"><span>💬</span><span>Chat on WhatsApp</span></a>${S.github?`<a href="${E(S.github)}" target="_blank" rel="noopener"><span>🐙</span><span>GitHub</span></a>`:""}${S.linkedin?`<a href="${E(S.linkedin)}" target="_blank" rel="noopener"><span>💼</span><span>LinkedIn</span></a>`:""}</div></div>`)+
`<footer><div class="wrap"><span>© <span id="yr"></span> ${E(S.full)}</span><span><a href="mailto:${E(S.email)}">Email</a><a href="https://wa.me/${S.whatsapp}" rel="noopener">WhatsApp</a>${S.github?`<a href="${E(S.github)}" rel="noopener">GitHub</a>`:""}${S.linkedin?`<a href="${E(S.linkedin)}" rel="noopener">LinkedIn</a>`:""}</span></div></footer><dialog id="soon"><p>Projects will be uploaded soon.</p><form method="dialog"><button class="btn p">Got it</button></form></dialog>`;
document.querySelectorAll("[data-soon]").forEach(a=>a.onclick=e=>{e.preventDefault();$("#soon").showModal()});
$("#yr").textContent=new Date().getFullYear();
// theme
const R=document.documentElement,tb=$("#theme");
let th="dark";try{th=localStorage.getItem("th")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}
function setT(t){R.dataset.theme=t;tb.textContent=t==="dark"?"☾":"☀";try{localStorage.setItem("th",t)}catch(e){}}
setT(th);tb.onclick=()=>setT(R.dataset.theme==="dark"?"light":"dark");
// menu
const m=$("#menu"),L=$("#links");
m.onclick=()=>{const o=L.classList.toggle("open");m.setAttribute("aria-expanded",o)};
L.querySelectorAll("a").forEach(a=>a.onclick=()=>{L.classList.remove("open");m.setAttribute("aria-expanded","false")});
// skill bars + active link
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.querySelectorAll("i[data-w]").forEach(i=>i.style.width=i.dataset.w+"%")}}),{threshold:.3});
document.querySelectorAll("#skills").forEach(s=>io.observe(s));
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)L.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section[id]").forEach(s=>so.observe(s));
// form: opens the visitor's email app (no server needed)
$("#f").onsubmit=ev=>{ev.preventDefault();const d=new FormData(ev.target);
location.href=`mailto:${S.email}?subject=${encodeURIComponent(d.get("s"))}&body=${encodeURIComponent(d.get("m")+"\n\n— "+d.get("n")+" ("+d.get("e")+")")}`;
$("#msg").textContent="Opening your email app to send this message."};
// hero network canvas
(function(){const c=$("#net"),x=c.getContext("2d");let w,h,P=[];
const rs=()=>{w=c.width=c.offsetWidth;h=c.height=c.offsetHeight;P=Array.from({length:Math.min(70,Math.floor(w/18))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))};
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function f(){x.clearRect(0,0,w,h);const col=R.dataset.theme==="dark"?"34,225,255":"11,98,214";
P.forEach((p,i)=>{if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1}
x.fillStyle=`rgba(${col},.8)`;x.beginPath();x.arc(p.x,p.y,1.8,0,7);x.fill();
for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){x.strokeStyle=`rgba(${col},${.22*(1-d/130)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});
if(!still)requestAnimationFrame(f)}
rs();f();addEventListener("resize",()=>{rs();if(still)f()});})();
</script>
</body>
